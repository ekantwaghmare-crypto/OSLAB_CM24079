<!DOCTYPE html>
<html>
<head>
<title>OS Simulator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Operating System Algorithm Simulator</h1>

<h2>SJF Scheduling</h2>
<input id="bt" placeholder="10,5,20">
<button onclick="sjf()">Run SJF</button>

<h2>LRU Page Replacement</h2>
<input id="pages" placeholder="1,2,3,4,1,2,5">
<button onclick="lru()">Run LRU</button>

<h2>SSTF Disk Scheduling</h2>
<input id="disk" placeholder="98,183,41,122,14">
<button onclick="sstf()">Run SSTF</button>

<h2>Banker Algorithm</h2>
<input id="alloc" placeholder="Allocation 0 1 0">
<input id="max" placeholder="Max 7 5 3">
<input id="avail" placeholder="Available 3 3 2">
<button onclick="banker()">Check Safe State</button>

<h2>Result</h2>
<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
